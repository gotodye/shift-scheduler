<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>排班看板</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e9edf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b28" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=36">
<link rel="stylesheet" href="board.css?v=36">
<script>try{var _t=localStorage.getItem('ss.theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="board">

<!-- 載入中 -->
<div class="gate" id="bootView"><div class="gate-box"><div class="spin"></div></div></div>

<!-- 登入 -->
<div class="gate" id="loginView" hidden>
  <div class="gate-box board-login">
    <div class="board-logo"><i data-lucide="calendar-check-2"></i></div>
    <h1 data-i18n="board_title">部門排班看板</h1>
    <p class="muted" data-i18n="board_login_hint">請用部門看板帳號登入</p>
    <input id="bEmail" type="email" autocomplete="username" data-i18n-ph="board_email" placeholder="Email">
    <input id="bPass" type="password" autocomplete="current-password" data-i18n-ph="board_pass" placeholder="密碼">
    <p class="err" id="bErr" hidden></p>
    <button class="btn primary" id="bLogin"><i data-lucide="log-in"></i><span data-i18n="board_login">登入</span></button>
    <select id="bLangLogin" class="lang-sel" title="Language">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
    </select>
  </div>
</div>

<!-- 看板 -->
<div id="boardMain" hidden>
  <header class="board-head">
    <div class="board-title"><i data-lucide="calendar-check-2"></i><span id="boardUnit"></span></div>
    <div class="board-nav">
      <button id="bPrev" class="btn icon" title="‹"><i data-lucide="chevron-left"></i></button>
      <button id="bToday" class="btn ghost sm" data-i18n="today">今天</button>
      <button id="bNext" class="btn icon" title="›"><i data-lucide="chevron-right"></i></button>
      <span id="boardRange" class="board-range"></span>
    </div>
    <div class="board-modes seg-theme">
      <button class="bmode active" data-mode="day" data-i18n="board_day">日</button>
      <button class="bmode" data-mode="week" data-i18n="board_week">週</button>
      <button class="bmode" data-mode="month" data-i18n="board_month">月</button>
    </div>
    <div class="board-right">
      <select id="bLang" class="lang-sel" title="Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
      </select>
      <button id="bSignout" class="btn ghost sm"><i data-lucide="log-out"></i><span data-i18n="signout">登出</span></button>
    </div>
  </header>
  <main class="board-body" id="boardBody"></main>
</div>

<script src="i18n.js?v=36"></script>
<script type="module" src="board.js?v=36"></script>
</body>
</html>
