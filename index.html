<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>排班系統</title>
<link rel="stylesheet" href="styles.css?v=10">
<script>try{var _t=localStorage.getItem('ss.theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- 登入 / 權限 gate -->
<div class="gate" id="bootView"><div class="gate-box"><div class="spin"></div><p data-i18n="loading">載入中…</p></div></div>
<div class="gate" id="loginView" hidden>
  <div class="gate-box">
    <div class="brand big"><span class="dot"></span> <span data-i18n="app_title">排班系統</span></div>
    <p class="muted" data-i18n="login_hint">請使用公司授權的 Google 帳號登入。</p>
    <button id="loginBtn" class="btn primary lg" data-i18n="login_btn">使用 Google 登入</button>
    <div style="margin-top:16px;">
      <select class="lang-sel" title="Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
      </select>
    </div>
  </div>
</div>
<div class="gate" id="noAccessView" hidden>
  <div class="gate-box">
    <h1 data-i18n="noaccess_title">沒有存取權限</h1>
    <p class="muted" id="naDesc"></p>
    <button id="signoutBtn2" class="btn ghost" data-i18n="switch_account">換帳號登入</button>
  </div>
</div>

<input type="file" id="punchFile" accept=".xlsx,.xls,.csv" hidden>

<header class="topbar">
  <div class="brand"><span class="dot"></span> <span class="brand-txt" data-i18n="app_title">排班系統</span></div>
  <div class="date-nav">
    <button id="prevDay" class="btn icon" data-i18n-title="prev_day" title="前一天">‹</button>
    <input type="date" id="datePick">
    <button id="nextDay" class="btn icon" data-i18n-title="next_day" title="後一天">›</button>
    <button id="todayBtn" class="btn ghost sm" data-i18n="today">今天</button>
    <span id="weekday" class="weekday"></span>
  </div>
  <div class="top-actions">
    <button id="exportBtn" class="btn primary" data-i18n="export">匯出打卡檔</button>
    <div class="menu" data-menu>
      <button class="btn ghost menu-btn caret" data-i18n="menu_view">檢視</button>
      <div class="menu-list">
        <button id="weekBtn" data-i18n="week_view">週檢視</button>
        <button id="rosterBtn" data-i18n="roster_btn">月班表</button>
        <button id="statsBtn" data-i18n="stats_btn">統計</button>
        <button id="compareBtn" data-i18n="compare_upload">上傳打卡比對</button>
        <button id="bonusBtn" data-i18n="bonus_btn" hidden>獎金報表</button>
      </div>
    </div>
    <div class="menu" data-menu>
      <button class="btn ghost menu-btn caret"><span id="userChip" class="user-chip"></span></button>
      <div class="menu-list menu-right">
        <div class="menu-row menu-keep"><span data-i18n="theme">主題</span>
          <div class="seg-theme">
            <button data-theme-val="auto" data-i18n="theme_auto">自動</button>
            <button data-theme-val="light" data-i18n="theme_light">淺色</button>
            <button data-theme-val="dark" data-i18n="theme_dark">深色</button>
          </div>
        </div>
        <div class="menu-row menu-keep"><span data-i18n="lang_label">語言</span>
          <select id="langSel" class="lang-sel" title="Language">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
            <option value="th">ไทย</option>
          </select>
        </div>
        <button id="userMgmtBtn" data-i18n="users" hidden>使用者</button>
        <button id="signoutBtn" data-i18n="signout">登出</button>
      </div>
    </div>
  </div>
</header>

<nav class="units" id="unitTabs"></nav>

<section class="toolbar">
  <div class="tpl-area">
    <span class="tb-label" data-i18n="tpl_label">班別範本</span>
    <div class="tpl-chips" id="tplChips"></div>
  </div>
  <div class="brush">
    <span class="tb-label" data-i18n="brush">筆刷</span>
    <button class="brush-btn active" data-brush="work" data-i18n="work">上班</button>
    <button class="brush-btn" data-brush="off" data-i18n="off">休假</button>
  </div>
  <div class="tool-btns">
    <button id="applyAll" class="btn ghost sm" data-i18n="apply_all" disabled>套用範本到全組</button>
    <button id="addPerson" class="btn ghost sm" data-i18n="add_person">＋ 新增人員</button>
    <div class="menu" data-menu>
      <button class="btn ghost sm menu-btn caret" data-i18n="menu_more">更多</button>
      <div class="menu-list menu-right">
        <button id="manageTpl" data-i18n="manage_tpl">管理範本</button>
        <button id="copyDay" data-i18n="copy_day">複製某日</button>
        <button id="copyWeek" data-i18n="copy_week">複製上週</button>
        <button id="swapBtn" data-i18n="swap_btn">交換/移動</button>
        <button id="clearDay" class="danger-text" data-i18n="clear_day">清空當日</button>
      </div>
    </div>
  </div>
</section>

<div class="hint" id="brushHint" hidden></div>

<main class="grid-wrap" id="gridWrap">
  <div class="grid" id="grid"></div>
</main>

<footer class="legend">
  <span data-i18n="legend_drag"></span>
  <span data-i18n="legend_move"></span>
  <span data-i18n="legend_resize"></span>
  <span data-i18n="legend_edit"></span>
  <span data-i18n="legend_brushoff"></span>
  <span data-i18n="legend_full"></span>
  <span data-i18n="legend_month"></span>
</footer>

<!-- 整月模式 overlay -->
<div class="month-view" id="monthView" hidden>
  <div class="mv-head">
    <button id="mvBack" class="btn ghost" data-i18n="mv_back">← 返回日檢視</button>
    <span class="mv-title" id="mvTitle"></span>
    <button id="mvEdit" class="btn ghost sm" data-i18n="edit_person">編輯人員</button>
    <div class="mv-monthnav">
      <button id="mvPrev" class="btn icon" data-i18n-title="prev_month" title="上個月">‹</button>
      <span id="mvMonth" class="mv-month"></span>
      <button id="mvNext" class="btn icon" data-i18n-title="next_month" title="下個月">›</button>
    </div>
  </div>
  <div class="mv-toolbar">
    <span class="tb-label" data-i18n="tpl_label">班別範本</span>
    <div class="tpl-chips" id="mvTplChips"></div>
    <div class="brush">
      <span class="tb-label" data-i18n="brush">筆刷</span>
      <button class="brush-btn active" data-brush="work" data-i18n="work">上班</button>
      <button class="brush-btn" data-brush="off" data-i18n="off">休假</button>
    </div>
    <div class="mv-tools">
      <button id="mvApplyEvery" class="btn ghost sm" data-i18n="apply_every" disabled>套用到整月每天</button>
      <button id="mvApplyWeekday" class="btn ghost sm" data-i18n="apply_weekday" disabled>只套用平日（一~五）</button>
      <button id="mvWeekendLeave" class="btn ghost sm" data-i18n="weekend_leave">週末設休假</button>
      <button id="mvClear" class="btn ghost sm danger-text" data-i18n="clear_month">清空整月</button>
    </div>
  </div>
  <div class="mv-grid-wrap"><div class="grid" id="monthGrid"></div></div>
  <div class="mv-hint" data-i18n="mv_hint"></div>
</div>

<!-- 工時統計 overlay -->
<div class="month-view" id="statsView" hidden>
  <div class="mv-head">
    <button id="statsBack" class="btn ghost" data-i18n="cmp_back">← 返回</button>
    <span class="mv-title" data-i18n="stats_title">工時統計</span>
    <label class="cmp-opt"><span data-i18n="from_date">起始日期</span> <input type="date" id="statsFrom"></label>
    <label class="cmp-opt"><span data-i18n="to_date">結束日期</span> <input type="date" id="statsTo"></label>
    <label class="cmp-opt"><input type="checkbox" id="statsAllUnits"> <span data-i18n="exp_all_units">全部單位</span></label>
    <div class="mv-monthnav">
      <button id="statsExport" class="btn ghost sm" data-i18n="stats_export">匯出統計</button>
    </div>
  </div>
  <div class="mv-grid-wrap"><div class="dash" id="statsBody"></div></div>
</div>

<!-- 週檢視 overlay -->
<div class="month-view" id="weekView" hidden>
  <div class="mv-head">
    <button id="weekBack" class="btn ghost" data-i18n="cmp_back">← 返回</button>
    <span class="mv-title" data-i18n="week_view">週檢視</span>
    <div class="mv-monthnav">
      <button id="weekPrev" class="btn icon" title="‹">‹</button>
      <span id="weekLabel" class="mv-month"></span>
      <button id="weekNext" class="btn icon" title="›">›</button>
    </div>
  </div>
  <div class="mv-grid-wrap"><table class="cmp-table week-table" id="weekTable"></table></div>
</div>

<!-- 月班表 overlay（可列印） -->
<div class="month-view" id="rosterView" hidden>
  <div class="mv-head no-print">
    <button id="rosterBack" class="btn ghost" data-i18n="cmp_back">← 返回</button>
    <span class="mv-title" data-i18n="roster_title">月班表</span>
    <label class="cmp-opt"><input type="checkbox" id="rosterAllUnits"> <span data-i18n="exp_all_units">全部單位</span></label>
    <div class="mv-monthnav">
      <button id="rosterPrev" class="btn icon" title="‹">‹</button>
      <span id="rosterLabel" class="mv-month"></span>
      <button id="rosterNext" class="btn icon" title="›">›</button>
      <button id="rosterPrint" class="btn ghost sm" data-i18n="print_btn">列印</button>
      <button id="rosterExport" class="btn ghost sm" data-i18n="export">匯出</button>
    </div>
  </div>
  <div class="mv-grid-wrap" id="rosterBody"></div>
</div>

<!-- 交換 / 移動 modal -->
<div class="modal-mask" id="swapModal" hidden>
  <div class="modal">
    <h3 data-i18n="swap_title">交換 / 移動班別</h3>
    <label><span data-i18n="swap_from">來源人員</span> <select id="swapA"></select></label>
    <label><span data-i18n="swap_to">目標人員</span> <select id="swapB"></select></label>
    <label><span data-i18n="src_date">日期</span> <input type="date" id="swapDate"></label>
    <p class="err" id="swapErr" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn ghost" id="swapMove" data-i18n="move_do">覆蓋（來源→目標）</button>
      <button class="btn primary" id="swapDo" data-i18n="swap_do">互相交換</button>
    </div>
  </div>
</div>

<!-- 打卡比對結果 overlay -->
<div class="month-view" id="compareView" hidden>
  <div class="mv-head">
    <button id="cmpBack" class="btn ghost" data-i18n="cmp_back">← 返回</button>
    <span class="mv-title" data-i18n="cmp_title">打卡比對結果</span>
    <label class="cmp-opt"><span data-i18n="cmp_grace">容許誤差(分)</span>
      <input type="number" id="cmpGrace" value="5" min="0" step="1">
    </label>
    <label class="cmp-opt"><input type="checkbox" id="cmpOnlyIssues"> <span data-i18n="cmp_only">只看異常</span></label>
    <div class="mv-monthnav">
      <button id="cmpExport" class="btn ghost sm" data-i18n="cmp_export">匯出差異清單</button>
    </div>
  </div>
  <div class="cmp-summary" id="cmpSummary"></div>
  <div class="mv-grid-wrap"><table class="cmp-table" id="cmpTable"></table></div>
</div>

<!-- 人員 modal -->
<div class="modal-mask" id="personModal" hidden>
  <div class="modal">
    <h3 id="personModalTitle">新增人員</h3>
    <label><span data-i18n="empno">工號</span> <span class="req">*</span><input id="pmEmpNo" data-i18n-ph="empno_ph" placeholder="例：A12345"></label>
    <label><span data-i18n="name">姓名</span> <span class="req">*</span><input id="pmName" data-i18n-ph="name_ph" placeholder="例：王小明"></label>
    <label class="chk"><input type="checkbox" id="pmForeign"> <span data-i18n="foreign_student">外籍學生</span></label>
    <p class="err" id="pmErr" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn primary" id="pmSave" data-i18n="save">儲存</button>
    </div>
  </div>
</div>

<!-- 區塊編輯 modal -->
<div class="modal-mask" id="segModal" hidden>
  <div class="modal">
    <h3 data-i18n="seg_title">編輯區塊</h3>
    <label><span data-i18n="type">類型</span>
      <select id="segType">
        <option value="work" data-i18n="opt_work">上班</option>
        <option value="off" data-i18n="opt_off">休假 / 不可上班</option>
      </select>
    </label>
    <div class="time-row">
      <label><span data-i18n="start">開始</span> <select id="segStart"></select></label>
      <label><span data-i18n="end">結束</span> <select id="segEnd"></select></label>
    </div>
    <p class="err" id="segErr" hidden></p>
    <div class="modal-actions">
      <button class="btn danger" id="segDelete" data-i18n="delete_seg">刪除此段</button>
      <span style="flex:1"></span>
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn primary" id="segSave" data-i18n="save">儲存</button>
    </div>
  </div>
</div>

<!-- 範本管理 modal -->
<div class="modal-mask" id="tplModal" hidden>
  <div class="modal">
    <h3 data-i18n="tpl_title">班別範本</h3>
    <div id="tplList" class="tpl-list"></div>
    <div class="tpl-add">
      <input id="tplName" data-i18n-ph="tpl_name_ph" placeholder="名稱，如「早班」" style="flex:1">
      <select id="tplStart"></select>
      <span>~</span>
      <select id="tplEnd"></select>
      <span class="tb-label" data-i18n="tpl_break">休息</span>
      <select id="tplBs"></select>
      <span>~</span>
      <select id="tplBe"></select>
      <button class="btn ghost sm" id="tplAdd" data-i18n="add">新增</button>
    </div>
    <div class="modal-actions">
      <button class="btn primary" data-close data-i18n="done">完成</button>
    </div>
  </div>
</div>

<!-- 複製某日 modal -->
<div class="modal-mask" id="copyModal" hidden>
  <div class="modal">
    <h3 data-i18n="copy_title">複製某日班表</h3>
    <p class="muted" data-i18n="copy_desc">把來源日期整組班表，覆蓋到目前選定的日期。</p>
    <label><span data-i18n="src_date">來源日期</span> <input type="date" id="copySrc"></label>
    <label class="chk"><input type="checkbox" id="copyAllUnits"> <span data-i18n="copy_all_units">套用到全部單位（否則只複製目前單位）</span></label>
    <p class="err" id="copyErr" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn primary" id="copyGo" data-i18n="copy">複製</button>
    </div>
  </div>
</div>

<!-- 匯出 modal -->
<div class="modal-mask" id="exportModal" hidden>
  <div class="modal">
    <h3 data-i18n="exp_title">匯出阿波羅打卡檔</h3>
    <div class="time-row">
      <label><span data-i18n="from_date">起始日期</span> <input type="date" id="expFrom"></label>
      <label><span data-i18n="to_date">結束日期</span> <input type="date" id="expTo"></label>
    </div>
    <label class="chk"><input type="checkbox" id="expAllUnits" checked> <span data-i18n="exp_all_units">匯出全部單位（否則只匯出目前單位）</span></label>
    <p class="muted small" data-i18n="exp_rule">規則：有排班→上班(W0001)+時段；中間空檔自動轉成休息時間；標記休假者→休假日(H0001)；沒排也沒標休假者不輸出。</p>
    <p class="err" id="expErr" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn primary" id="expGo" data-i18n="gen_excel">產生 Excel</button>
    </div>
  </div>
</div>

<!-- 獎金時數報表 modal（管理員） -->
<div class="modal-mask" id="bonusModal" hidden>
  <div class="modal">
    <h3 data-i18n="bonus_report">獎金時數報表</h3>
    <div class="time-row">
      <label><span data-i18n="from_date">起始日期</span> <input type="date" id="bonusFrom"></label>
      <label><span data-i18n="to_date">結束日期</span> <input type="date" id="bonusTo"></label>
    </div>
    <label class="chk"><input type="checkbox" id="bonusAllUnits" checked> <span data-i18n="exp_all_units">匯出全部單位</span></label>
    <p class="muted small" data-i18n="bonus_desc"></p>
    <p class="err" id="bonusErr" hidden></p>
    <div class="modal-actions">
      <button class="btn ghost" data-close data-i18n="cancel">取消</button>
      <button class="btn primary" id="bonusGo" data-i18n="gen_excel">產生 Excel</button>
    </div>
  </div>
</div>

<!-- 使用者管理 modal（管理員） -->
<div class="modal-mask" id="userModal" hidden>
  <div class="modal">
    <h3 data-i18n="um_title">使用者管理</h3>
    <div id="umList" class="tpl-list"></div>
    <div style="border-top:1px solid var(--line); padding-top:12px;">
      <label><span data-i18n="um_email">新增 / 更新使用者 Email</span> <input id="umEmail" placeholder="someone@gmail.com"></label>
      <label class="chk"><input type="checkbox" id="umAdmin"> <span data-i18n="um_admin">設為管理員（可管理所有單位與使用者）</span></label>
      <div class="muted small" style="margin:8px 0 4px;" data-i18n="um_units_hint">或勾選可編輯的單位：</div>
      <div id="umUnits" class="um-units"></div>
      <button class="btn ghost sm" id="umAdd" style="margin-top:10px;" data-i18n="um_add">新增 / 更新</button>
    </div>
    <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
      <button class="btn ghost sm" id="importBtn" data-i18n="import_btn">匯入人員</button>
      <button class="btn ghost sm" id="seedTestBtn" data-i18n="test_seed">產生測試資料</button>
      <button class="btn ghost sm danger-text" id="clearTestBtn" data-i18n="test_clear">清除測試資料</button>
    </div>
    <p class="muted small" data-i18n="import_desc" style="margin:6px 0 0;"></p>
    <div class="modal-actions"><button class="btn primary" data-close data-i18n="done">完成</button></div>
  </div>
</div>

<script src="i18n.js?v=10"></script>
<script src="app.js?v=10"></script>
<script type="module" src="firebase-init.js?v=10"></script>
</body>
</html>
